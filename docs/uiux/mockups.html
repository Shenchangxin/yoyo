<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoyo UI/UX 方案 · 界面草图</title>
<style>
@font-face {
  font-family: "Plus Jakarta Sans Variable";
  src: url("../../frontend/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
  font-weight: 200 800;
}
@font-face {
  font-family: "JetBrains Mono Variable";
  src: url("../../frontend/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
  font-weight: 100 800;
}

:root, [data-theme="dark"] {
  --bg: #1c1c1a;
  --sidebar: #222220;
  --card: #262624;
  --popover: #2c2c29;
  --input: #242422;
  --lift: #32322e;
  --line: color-mix(in srgb, #f4f4f0 9%, transparent);
  --line-strong: color-mix(in srgb, #f4f4f0 14%, transparent);
  --fg: #f4f4f0;
  --fg-2: color-mix(in srgb, #f4f4f0 84%, transparent);
  --muted: #8c8b85;
  --muted-2: color-mix(in srgb, #8c8b85 72%, transparent);
  --accent: #5c99d6;
  --success: #74b48a;
  --warning: #d4b06a;
  --danger: #e06b66;
  --on-warning: #1c1c1a;
  --shadow-1: inset 0 1px 0 color-mix(in srgb, white 5%, transparent);
  --shadow-2: 0 18px 44px color-mix(in srgb, black 42%, transparent), 0 0 0 1px color-mix(in srgb, white 7%, transparent);
  --shadow-composer: 0 10px 30px color-mix(in srgb, black 26%, transparent);
}
[data-theme="light"] {
  --bg: #fbfbfa;
  --sidebar: #f3f3f0;
  --card: #ffffff;
  --popover: #ffffff;
  --input: #ffffff;
  --lift: #ebebe7;
  --line: color-mix(in srgb, #1c1c1a 8%, transparent);
  --line-strong: color-mix(in srgb, #1c1c1a 13%, transparent);
  --fg: #1c1c1a;
  --fg-2: color-mix(in srgb, #1c1c1a 84%, transparent);
  --muted: #6f6e68;
  --muted-2: color-mix(in srgb, #6f6e68 78%, transparent);
  --accent: #0169cc;
  --success: #1f7a45;
  --warning: #a07a2a;
  --danger: #c4453e;
  --on-warning: #ffffff;
  --shadow-1: 0 1px 0 color-mix(in srgb, #1c1c1a 4%, transparent);
  --shadow-2: 0 18px 44px color-mix(in srgb, #1c1c1a 12%, transparent), 0 0 0 1px color-mix(in srgb, #1c1c1a 6%, transparent);
  --shadow-composer: 0 10px 30px color-mix(in srgb, #1c1c1a 7%, transparent);
}

:root {
  --font-sans: "Plus Jakarta Sans Variable", "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono Variable", ui-monospace, "Cascadia Code", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 20px;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 64px minmax(0, 1fr) 400px; height: 100vh; }
.app.settings { grid-template-columns: 64px 232px minmax(0, 1fr); }

/* 导航轨 */
.rail {
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 10px;
}
.me { position: relative; width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 10px; border-radius: 12px; }
.me .ring { position: absolute; inset: 4px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--accent) 70%, transparent); }
.me .dot { position: absolute; right: 5px; bottom: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--warning); border: 2px solid var(--sidebar); }
.sphere {
  position: relative;
  width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #fffdf6 0%, #f1e9d8 52%, #d9ccb2 100%);
  box-shadow: inset 0 -2px 4px rgba(0, 0, 0, .14);
}
.sphere::before, .sphere::after {
  content: ""; position: absolute; top: 37%;
  width: 3px; height: 8px; border-radius: 2px; background: #2b2a27;
}
.sphere::before { left: 34%; }
.sphere::after { right: 34%; }
.sphere.sm { width: 22px; height: 22px; }
.sphere.sm::before, .sphere.sm::after { width: 2.5px; height: 6px; }
.sphere.xs { width: 18px; height: 18px; }
.sphere.xs::before, .sphere.xs::after { width: 2px; height: 5px; top: 36%; }

.nav { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.nav-item { position: relative; width: 56px; padding: 6px 0 5px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); }
.nav-item .ic { width: 36px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.nav-item .lb { font-size: 11px; line-height: 14px; }
.nav-item.on { color: var(--fg); }
.nav-item.on .ic { background: var(--lift); }
.nav-item.on::before { content: ""; position: absolute; left: -4px; top: 12px; height: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item .badge {
  position: absolute; top: 2px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; background: var(--warning); color: var(--on-warning);
  font-size: 10px; line-height: 16px; font-weight: 600; text-align: center;
}
.rail .spacer { flex: 1; }

/* 主舞台 */
.stage { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.topbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 24px; flex: none; }
.topbar .title { font-size: 13px; font-weight: 500; }
.topbar .sub { color: var(--muted); font-size: 12px; }
.topbar .grow { flex: 1; }
.kbd { height: 22px; padding: 0 7px; border-radius: 6px; background: var(--lift); border: 1px solid var(--line); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn.on { background: var(--lift); color: var(--fg); }
.win { display: flex; margin-left: 6px; }
.win span { width: 38px; height: 32px; display: grid; place-items: center; color: var(--muted); }

.thread { flex: 1; min-height: 0; overflow: hidden; }
.col { width: min(100%, 736px); margin: 0 auto; padding: 4px 40px 0; }
.daysep { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 6px 0 16px; }
.daysep::before, .daysep::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.event {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px 9px 10px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-1);
}
.event .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--lift); display: grid; place-items: center; color: var(--fg-2); flex: none; }
.event .tx { min-width: 0; flex: 1; }
.event .t { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event .d { font-size: 12px; line-height: 18px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event .acts { display: flex; gap: 6px; flex: none; }
.event.slim { padding: 7px 10px; }

.user { display: flex; justify-content: flex-end; margin: 22px 0 0; }
.user .b { max-width: 78%; background: var(--lift); border-radius: 18px; padding: 8px 14px; font-size: 14px; line-height: 22px; }
.asst { display: flex; gap: 12px; margin-top: 18px; }
.asst .stamp { flex: none; padding-top: 1px; }
.asst .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.proc { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.proc .gly { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); }
.answer { font-size: 14px; line-height: 23px; color: var(--fg); }
.answer p + p { margin-top: 6px; }
.answer code { font-family: var(--font-mono); font-size: 12px; background: var(--lift); padding: 1px 5px; border-radius: 4px; font-variant-ligatures: none; }
.receipt { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.receipt .u { color: var(--fg-2); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }

.composer-wrap { flex: none; width: min(100%, 736px); margin: 0 auto; padding: 10px 40px 12px; }
.composer {
  background: var(--input); border: 1px solid var(--line-strong); border-radius: 16px;
  padding: 12px 10px 8px 16px; box-shadow: var(--shadow-composer);
}
.composer.focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow-composer); }
.composer .ph { color: var(--muted); font-size: 14px; line-height: 24px; }
.composer .bar { display: flex; align-items: center; gap: 2px; margin-top: 10px; margin-left: -6px; }
.chip { height: 28px; padding: 0 8px; border-radius: 8px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip.target { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--fg); }
.send { width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; margin-left: auto; }
.send.dim { background: var(--lift); color: var(--muted); }
.stats { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: var(--muted-2); margin-top: 7px; }

/* 右侧个人面板 */
.panel { background: var(--sidebar); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; position: relative; }
.panel-head { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; flex: none; }
.panel-head .who { min-width: 0; flex: 1; }
.panel-head .name { font-size: 13px; font-weight: 600; line-height: 18px; }
.panel-head .status { font-size: 12px; line-height: 16px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); flex: none; }
.tabs { display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
.tab { height: 36px; display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); position: relative; }
.tab.on { color: var(--fg); font-weight: 500; }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--fg); border-radius: 1px; }
.tab .n { font-size: 11px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.tab .n.need { color: var(--warning); }
.panel-body { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px; }

.datehead { display: flex; align-items: flex-start; gap: 8px; }
.datehead .tx { flex: 1; }
.date { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; }
.date-sub { font-size: 12px; line-height: 18px; color: var(--muted); }

.eyebrow { font-size: 12px; line-height: 18px; font-weight: 500; color: var(--fg-2); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.eyebrow .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.eyebrow .n.need { color: var(--warning); }
.eyebrow .end { margin-left: auto; color: var(--muted); font-weight: 400; display: inline-flex; align-items: center; gap: 2px; }

.list { border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-1); overflow: hidden; }
.row { display: flex; gap: 10px; padding: 10px 12px; align-items: flex-start; }
.row + .row { border-top: 1px solid var(--line); }
.row .lead { flex: none; width: 16px; height: 20px; display: grid; place-items: center; color: var(--muted); }
.st { width: 8px; height: 8px; border-radius: 50%; }
.st.need { background: var(--warning); }
.st.live { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.st.done { background: var(--success); }
.st.idle { background: transparent; border: 1.5px solid var(--muted-2); }
.st.fail { background: var(--danger); }
.row .main { min-width: 0; flex: 1; }
.row .t { font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .d { font-size: 12px; line-height: 18px; color: var(--muted); }
.row .d.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .m { font-size: 11px; line-height: 16px; color: var(--muted-2); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.row .side { flex: none; display: flex; gap: 6px; align-items: center; }
.row.hover { background: color-mix(in srgb, var(--lift) 55%, transparent); }

.btn { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.secondary { background: var(--lift); color: var(--fg); }
.btn.ghost { color: var(--muted); padding: 0 6px; }
.btn.sm { height: 24px; padding: 0 8px; border-radius: 6px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; box-shadow: var(--shadow-1); position: relative; }
.card .kicker { font-size: 12px; line-height: 18px; color: var(--accent); font-weight: 500; }
.card .title { font-size: 15px; line-height: 22px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
.card .lede { font-size: 12px; line-height: 18px; color: var(--muted); margin-top: 2px; }
.card .lines { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
.line { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; }
.line .k { font-weight: 500; min-width: 64px; }
.line .v { color: var(--muted); font-size: 12px; }
.line .time { font-variant-numeric: tabular-nums; color: var(--fg-2); min-width: 40px; font-size: 12px; }
.card .foot { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
.card .foot .grow { flex: 1; }
.tag { height: 20px; padding: 0 6px; border-radius: 5px; background: var(--lift); color: var(--muted); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tag.warn { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }

.endline { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }

.pop {
  position: absolute; width: 300px; padding: 12px 14px; border-radius: 12px;
  background: var(--popover); box-shadow: var(--shadow-2); z-index: 5; font-size: 12px; line-height: 18px;
}
.pop .h { font-size: 12px; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
.pop .r { display: flex; gap: 8px; color: var(--fg-2); }
.pop .r + .r { margin-top: 6px; }
.pop .r .k { color: var(--muted); min-width: 36px; }
.pop .sep { height: 1px; background: var(--line); margin: 10px -14px; }
.pop .menu { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.pop .menu span { padding: 5px 8px; border-radius: 6px; color: var(--fg-2); }
.pop .menu span:first-child { background: var(--lift); color: var(--fg); }

/* 任务会话（面板内） */
.taskhead { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; height: 52px; flex: none; border-bottom: 1px solid var(--line); }
.taskhead .tx { min-width: 0; flex: 1; }
.taskhead .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; }
.taskhead .d { font-size: 11px; color: var(--muted); line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--fg); white-space: nowrap; }
.steps { display: flex; flex-direction: column; gap: 0; margin-left: 4px; border-left: 1px solid var(--line); padding-left: 14px; }
.step { position: relative; display: flex; gap: 8px; font-size: 12px; line-height: 18px; color: var(--muted); padding: 3px 0; }
.step::before { content: ""; position: absolute; left: -18px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--sidebar); border: 1.5px solid var(--muted-2); }
.step.ok::before { background: var(--muted-2); border-color: var(--muted-2); }
.step.now { color: var(--fg); }
.step.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.step code { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); font-variant-ligatures: none; }
.step .add { color: var(--success); font-family: var(--font-mono); font-size: 11px; }
.step .del { color: var(--danger); font-family: var(--font-mono); font-size: 11px; }
.shimmer { background: linear-gradient(90deg, var(--fg) 0%, var(--muted) 50%, var(--fg) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.handoff { font-size: 12px; line-height: 18px; color: var(--muted); padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--lift) 60%, transparent); }
.handoff b { color: var(--fg-2); font-weight: 500; }
.tbody { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.tanswer { font-size: 13px; line-height: 21px; }
.tcomposer { flex: none; margin: 0 12px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--input); padding: 8px 8px 8px 12px; }
.tcomposer .lab { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tcomposer .in { display: flex; align-items: center; gap: 6px; }
.tcomposer .ph { flex: 1; color: var(--muted); font-size: 13px; }
.tcomposer .send { width: 26px; height: 26px; }
.qcard { border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); background: color-mix(in srgb, var(--warning) 8%, var(--card)); border-radius: 12px; padding: 10px 12px; }
.qcard .q { font-size: 13px; font-weight: 500; line-height: 20px; }
.qcard .opts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

/* 记忆 */
.about { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-1); }
.about .h { display: flex; align-items: center; gap: 8px; }
.about .h .t { font-size: 15px; font-weight: 600; flex: 1; }
.about p { font-size: 13px; line-height: 21px; color: var(--fg-2); margin-top: 6px; }
.about .m { font-size: 11px; color: var(--muted-2); margin-top: 6px; }
.src { height: 18px; padding: 0 6px; border-radius: 5px; font-size: 11px; display: inline-flex; align-items: center; background: var(--lift); color: var(--muted); white-space: nowrap; }
.src.you { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--fg-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { height: 24px; padding: 0 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); font-size: 12px; display: inline-flex; align-items: center; color: var(--fg-2); }
.rowacts { display: flex; gap: 2px; }
.rowacts span { height: 22px; padding: 0 6px; border-radius: 5px; font-size: 11px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 4px; }
.rowacts span:hover, .rowacts span.on { background: var(--lift); }

/* 设置 */
.subnav { background: var(--sidebar); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.subnav .search { height: 32px; border-radius: 8px; background: var(--lift); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.subnav .it { height: 32px; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; color: var(--fg-2); font-size: 13px; }
.subnav .it svg { color: var(--muted); }
.subnav .it.on { background: var(--lift); color: var(--fg); font-weight: 500; }
.subnav .it.on svg { color: var(--fg); }
.subnav .it .n { margin-left: auto; font-size: 11px; color: var(--muted-2); }
.subnav .group { font-size: 11px; color: var(--muted-2); padding: 12px 10px 4px; }
.settings-main { overflow: hidden; display: flex; flex-direction: column; }
.settings-col { width: min(100%, 720px); margin: 0 auto; padding: 8px 40px 40px; display: flex; flex-direction: column; gap: 22px; }
.ph1 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
.ph1-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-1); }
.form-t { font-size: 12px; font-weight: 500; color: var(--fg-2); margin-bottom: 6px; }
.frow { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 52px; }
.frow + .frow { border-top: 1px solid var(--line); }
.frow .l { flex: 1; min-width: 0; }
.frow .l .t { font-size: 13px; line-height: 20px; }
.frow .l .d { font-size: 12px; line-height: 18px; color: var(--muted); }
.switch { width: 36px; height: 22px; border-radius: 11px; background: var(--lift); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch.on { background: var(--success); }
.switch.on::after { left: 17px; }
.field { height: 30px; min-width: 76px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--input); display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: color-mix(in srgb, var(--lift) 85%, transparent); padding: 2px; border-radius: 9px; }
.seg span { height: 26px; padding: 0 12px; border-radius: 7px; display: inline-flex; align-items: center; font-size: 12px; color: var(--muted); }
.seg span.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow-1), 0 1px 2px rgba(0,0,0,.18); font-weight: 500; }
.link { color: var(--fg-2); font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }

/* 浏览用的切换条，截图时隐藏 */
.switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--popover); box-shadow: var(--shadow-2); z-index: 20; }
.switcher a { padding: 5px 10px; border-radius: 8px; font-size: 12px; color: var(--muted); text-decoration: none; }
.switcher a.on { background: var(--lift); color: var(--fg); }
.shot .switcher { display: none; }
</style>

const screens = {

  why: () => `<div class="app">${rail("home")}${conversation()}${today(true)}</div>`,

  memory: () => `<div class="app">${rail("home")}${conversation()}${memory()}</div>`,
  settings,
};
const labels = { home: "今天", why: "为什么", tasks: "任务", task: "任务会话", memory: "记忆", settings: "设置" };

function render() {
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") === "light" ? "light" : "dark";
  if (q.get("shot")) document.body.classList.add("shot");
  const key = (location.hash || "#home").slice(1);
  const name = screens[key] ? key : "home";
  const theme = document.documentElement.dataset.theme;
  const switcher = `<div class="switcher">${Object.keys(screens).map((k) => `<a href="#${k}" class="${k === name ? "on" : ""}">${labels[k]}</a>`).join("")}<a href="?theme=${theme === "dark" ? "light" : "dark"}#${name}">${theme === "dark" ? "浅色" : "深色"}</a></div>`;
  document.getElementById("app").innerHTML = screens[name]() + switcher;
}
window.addEventListener("hashchange", render);
render();
