<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yoyo Game World</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141413; color: #eceae4; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
    #wrap { position: relative; height: 100%; }
    #stage { display: block; width: 100%; height: 100%; outline: none; }
    #hud { position: absolute; left: 12px; top: 12px; max-width: 42rem; pointer-events: none; }
    #objective { font-weight: 600; }
    #score { opacity: 0.72; margin-top: 2px; font-variant-numeric: tabular-nums; }
    #restart { position: absolute; right: 12px; top: 12px; background: #242422; color: inherit; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 10px; }
    #outcome { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font-size: 42px; letter-spacing: 0.12em; font-weight: 700; pointer-events: none; }
    #outcome:empty { display: none; }
    #help { position: absolute; left: 12px; bottom: 12px; opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="stage" tabindex="0"></canvas>
    <div id="hud"></div>
    <button id="restart" type="button">Restart</button>
    <div id="outcome" data-state=""></div>
    <div id="help">WASD move · R restart</div>
  </div>
  <script>window.__YOYO_GAME__ = __YOYO_GAME_JSON__;</script>
  <script src="runtime.js"></script>
</body>
</html>
