<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yoyo</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("yoyo-theme");
          var dark =
            p === "light"
              ? false
              : p === "dark"
                ? true
                : !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
          var darkPal = localStorage.getItem("yoyo-palette-dark");
          var lightPal = localStorage.getItem("yoyo-palette-light");
          var pal = dark
            ? darkPal === "dim" || darkPal === "slate" || darkPal === "ink"
              ? darkPal
              : "ink"
            : lightPal === "paper" || lightPal === "mist" || lightPal === "neutral"
              ? lightPal
              : "neutral";
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.setAttribute("data-palette", pal);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var ua = navigator.userAgent || "";
          document.documentElement.dataset.os = /Windows/i.test(ua)
            ? "windows"
            : /Mac/i.test(ua) && !/iPhone|iPad|iPod/.test(ua)
              ? "mac"
              : "linux";
          var scale = parseFloat(localStorage.getItem("yoyo-ui-scale") || "1");
          var steps = [1, 1.25, 1.5];
          var snapped = 1;
          var dist = Infinity;
          if (scale > 0 && isFinite(scale)) {
            for (var i = 0; i < steps.length; i++) {
              var d = Math.abs(steps[i] - scale);
              if (d < dist) {
                dist = d;
                snapped = steps[i];
              }
            }
          }
          document.documentElement.style.setProperty("--ui-scale", String(snapped));
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-palette", "ink");
        }
      })();
    </script>
  </head>
  <body class="h-full bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
