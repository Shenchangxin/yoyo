<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yoyo</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("yoyo-theme");
          var dark =
            p === "light"
              ? false
              : p === "dark"
                ? true
                : !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
          var darkPal = localStorage.getItem("yoyo-palette-dark");
          var lightPal = localStorage.getItem("yoyo-palette-light");
          var pal = dark
            ? darkPal === "dim" || darkPal === "slate" || darkPal === "ink"
              ? darkPal
              : "ink"
            : lightPal === "paper" || lightPal === "mist" || lightPal === "neutral"
              ? lightPal
              : "neutral";
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.setAttribute("data-palette", pal);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var scale = parseFloat(localStorage.getItem("yoyo-ui-scale") || "1");
          if (scale > 0 && isFinite(scale)) {
            document.documentElement.style.setProperty("--ui-scale", String(scale));
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-palette", "ink");
        }
      })();
    </script>
  </head>
  <body class="h-full bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
