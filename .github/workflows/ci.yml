name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Seed frontend/dist for go embed
        shell: bash
        run: |
          mkdir -p frontend/dist
          if [[ -z "$(ls -A frontend/dist 2>/dev/null || true)" ]]; then
            printf 'go embed stub\n' > frontend/dist/.keep
          fi
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build -o bin/yoyo.exe ./cmd/yoyo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build UI
        working-directory: frontend
        run: |
          npm install
          npm run build

  handheld:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Analyze, test, and build the Android app
        working-directory: handheld
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/Yoyo-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: handheld-android
          path: dist/Yoyo-android.apk
          if-no-files-found: error
          retention-days: 14
