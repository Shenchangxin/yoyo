name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "22"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Seed frontend/dist for go embed
        shell: bash
        run: |
          mkdir -p frontend/dist
          if [[ -z "$(ls -A frontend/dist 2>/dev/null || true)" ]]; then
            printf 'go embed stub\n' > frontend/dist/.keep
          fi
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build -o bin/yoyo.exe ./cmd/yoyo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: |
          npm install
          npm run build

  desktop:
    needs: [meta, test, frontend]
    name: desktop (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin an x64 runner. windows-11-arm is a different image; amd64 == x64.
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: universal
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version parts
        run: echo "VERSION_NSIS=${VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Linux GTK / WebKit headers
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config gcc \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libwayland-dev \
            wget file desktop-file-utils patchelf

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Install Wails CLI
        run: |
          ver="$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')"
          echo "wails ${ver}"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${ver}"

      - name: Stamp version metadata
        run: go run ./scripts/stampversion "$VERSION"

      - name: Build Windows x64 installer
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          wails3 task windows:package \
            "VERSION=${VERSION}" \
            "VERSION_NSIS=${VERSION_NSIS}" \
            ARCH=amd64 \
            INSTALL_SCOPE=user

      - name: Build macOS app and DMG
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          wails3 task darwin:package:universal "VERSION=${VERSION}"
          wails3 task darwin:create:dmg "VERSION=${VERSION}"

      - name: Build Linux packages
        if: matrix.goos == 'linux'
        env:
          GOARCH: amd64
          NO_STRIP: "1"
          GIT_COMMITTER_NAME: Yoyo
          GIT_COMMITTER_EMAIL: noreply@users.noreply.github.com
        run: |
          set -euo pipefail
          wails3 task linux:build "VERSION=${VERSION}" ARCH=amd64
          wails3 task linux:create:appimage "VERSION=${VERSION}" ARCH=amd64
          wails3 task linux:create:deb "VERSION=${VERSION}" ARCH=amd64
          wails3 task linux:create:rpm "VERSION=${VERSION}" ARCH=amd64

      - name: Collect Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = Get-ChildItem -Path bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $src) { throw "missing NSIS installer in bin/" }
          Copy-Item $src.FullName "dist/Yoyo-$env:VERSION-windows-x64-setup.exe"
          Copy-Item $src.FullName "dist/Yoyo-$env:VERSION-windows-amd64-setup.exe"

      - name: Collect macOS DMG
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          dmgs=(bin/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "expected one .dmg in bin/, got: ${dmgs[*]:-none}" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          mv "${dmgs[0]}" "dist/Yoyo-${VERSION}-darwin-universal.dmg"

      - name: Collect Linux packages
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          images=(bin/*.AppImage)
          debs=(bin/*.deb)
          rpms=(bin/*.rpm)
          if (( ${#images[@]} < 1 )); then
            echo "missing AppImage in bin/" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          if (( ${#debs[@]} < 1 )); then
            echo "missing .deb in bin/" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          if (( ${#rpms[@]} < 1 )); then
            echo "missing .rpm in bin/" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          cp "${images[0]}" "dist/Yoyo-${VERSION}-linux-amd64.AppImage"
          chmod +x "dist/Yoyo-${VERSION}-linux-amd64.AppImage"
          cp "${debs[0]}" "dist/Yoyo-${VERSION}-linux-amd64.deb"
          cp "${rpms[0]}" "dist/Yoyo-${VERSION}-linux-amd64.rpm"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: [meta, test]
    name: cli (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bin dist
          ext=""
          if [[ "${GOOS}" == windows ]]; then
            ext=".exe"
          fi
          out="bin/yoyo${ext}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/Shenchangxin/yoyo/internal/version.Version=${VERSION}" \
            -o "${out}" ./cmd/yoyo
          if [[ "${GOOS}" == windows ]]; then
            python3 -c "import os, zipfile; v, o, a = os.environ['VERSION'], os.environ['GOOS'], os.environ['GOARCH']; z = zipfile.ZipFile(f'dist/yoyo-cli-{v}-{o}-{a}.zip', 'w', zipfile.ZIP_DEFLATED); z.write('bin/yoyo.exe', 'yoyo.exe')"
          else
            tar -C bin -czf "dist/yoyo-cli-${VERSION}-${GOOS}-${GOARCH}.tar.gz" yoyo
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [meta, desktop, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yoyo ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Install the desktop app, then run it:

            - **Windows x64:** `Yoyo-*-windows-x64-setup.exe` (same file as `windows-amd64`) — per-user installer, no admin. Finish page can launch Yoyo.
            - **macOS:** `Yoyo-*-darwin-universal.dmg` — open the disk image and drag Yoyo into Applications.
            - **Linux:** `Yoyo-*-linux-amd64.AppImage` (chmod +x, double-click) or install the `.deb` / `.rpm`.

            CLI archives (`yoyo-cli-*`) are optional command-line builds. macOS is ad-hoc signed, not notarized. Windows and Linux packages are unsigned. `yoyo update apply` stays a human step.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
