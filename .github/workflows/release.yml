name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "22"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Seed frontend/dist for go embed
        shell: bash
        run: |
          mkdir -p frontend/dist
          if [[ -z "$(ls -A frontend/dist 2>/dev/null || true)" ]]; then
            printf 'go embed stub\n' > frontend/dist/.keep
          fi
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build -o bin/yoyo.exe ./cmd/yoyo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: |
          npm install
          npm run build

  desktop:
    needs: [meta, test, frontend]
    name: desktop (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin an x64 runner. windows-11-arm is a different image; amd64 == x64.
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: universal
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version parts
        run: echo "VERSION_NSIS=${VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Linux GTK / WebKit headers
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config gcc \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libwayland-dev \
            wget file desktop-file-utils patchelf

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Install Wails CLI
        run: |
          ver="$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')"
          echo "wails ${ver}"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${ver}"

      - name: Stamp version metadata
        run: go run ./scripts/stampversion "$VERSION"

      - name: Build Windows x64 installer
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          wails3 task windows:package \
            "VERSION=${VERSION}" \
            "VERSION_NSIS=${VERSION_NSIS}" \
            ARCH=amd64 \
            INSTALL_SCOPE=user

      - name: Build macOS app and DMG
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          wails3 task darwin:package:universal "VERSION=${VERSION}"
          wails3 task darwin:create:dmg "VERSION=${VERSION}"

      - name: Build Linux packages
        if: matrix.goos == 'linux'
        env:
          GOARCH: amd64
          NO_STRIP: "1"
          GIT_COMMITTER_NAME: Yoyo
          GIT_COMMITTER_EMAIL: noreply@users.noreply.github.com
        run: |
          set -euo pipefail
          wails3 task linux:build "VERSION=${VERSION}" ARCH=amd64
          wails3 task linux:create:appimage "VERSION=${VERSION}" ARCH=amd64
          wails3 task linux:create:deb "VERSION=${VERSION}" ARCH=amd64
          wails3 task linux:create:rpm "VERSION=${VERSION}" ARCH=amd64

      - name: Collect Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = Get-ChildItem -Path bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $src) { throw "missing NSIS installer in bin/" }
          Copy-Item $src.FullName "dist/Yoyo-$env:VERSION-windows-x64-setup.exe"
          Copy-Item $src.FullName "dist/Yoyo-$env:VERSION-windows-amd64-setup.exe"

      - name: Collect macOS DMG
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          dmgs=(bin/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "expected one .dmg in bin/, got: ${dmgs[*]:-none}" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          mv "${dmgs[0]}" "dist/Yoyo-${VERSION}-darwin-universal.dmg"

      - name: Collect Linux packages
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          images=(bin/*.AppImage)
          debs=(bin/*.deb)
          rpms=(bin/*.rpm)
          if (( ${#images[@]} < 1 )); then
            echo "missing AppImage in bin/" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          if (( ${#debs[@]} < 1 )); then
            echo "missing .deb in bin/" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          if (( ${#rpms[@]} < 1 )); then
            echo "missing .rpm in bin/" >&2
            ls -la bin >&2 || true
            exit 1
          fi
          cp "${images[0]}" "dist/Yoyo-${VERSION}-linux-amd64.AppImage"
          chmod +x "dist/Yoyo-${VERSION}-linux-amd64.AppImage"
          cp "${debs[0]}" "dist/Yoyo-${VERSION}-linux-amd64.deb"
          cp "${rpms[0]}" "dist/Yoyo-${VERSION}-linux-amd64.rpm"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: [meta, test]
    name: cli (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bin dist
          ext=""
          if [[ "${GOOS}" == windows ]]; then
            ext=".exe"
          fi
          out="bin/yoyo${ext}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/Shenchangxin/yoyo/internal/version.Version=${VERSION}" \
            -o "${out}" ./cmd/yoyo
          if [[ "${GOOS}" == windows ]]; then
            python3 -c "import os, zipfile; v, o, a = os.environ['VERSION'], os.environ['GOOS'], os.environ['GOARCH']; z = zipfile.ZipFile(f'dist/yoyo-cli-{v}-{o}-{a}.zip', 'w', zipfile.ZIP_DEFLATED); z.write('bin/yoyo.exe', 'yoyo.exe')"
          else
            tar -C bin -czf "dist/yoyo-cli-${VERSION}-${GOOS}-${GOARCH}.tar.gz" yoyo
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  handheld:
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Optional upload keystore
        working-directory: handheld/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "No upload keystore. The APK is signed with the debug key so it can be sideloaded."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > app/upload.jks
          cat > keystore.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload.jks
          EOF
      - name: Build the Android app
        working-directory: handheld
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Yoyo-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: handheld-android
          path: dist/Yoyo-*-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [meta, desktop, cli, handheld]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yoyo ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Install the desktop app, then run it:

            - **Windows x64:** `Yoyo-*-windows-x64-setup.exe` (same file as `windows-amd64`) — per-user installer, no admin. Finish page can launch Yoyo.
            - **macOS:** `Yoyo-*-darwin-universal.dmg` — open the disk image and drag Yoyo into Applications.
            - **Linux:** `Yoyo-*-linux-amd64.AppImage` (chmod +x, double-click) or install the `.deb` / `.rpm`.
            - **Android:** `Yoyo-*-android.apk` — sideload it. The phone and the computer must be on the same LAN. In the desktop app, Settings → Advanced → Handheld, show the code, then allow the phone. Without the app, scan that same code with WeChat; after you allow it, the phone browser is the desktop UI and actions run on the computer.

            iOS needs a Mac and Apple signing, so this release does not include an installable IPA. HarmonyOS is the service-card source under `handheld/harmony`, not a store HAP. If the APK signing key changes, uninstall the old app before installing the new one.

            CLI archives (`yoyo-cli-*`) are optional command-line builds. macOS is ad-hoc signed, not notarized. Windows and Linux packages are unsigned. In-app OTA reads signed latest.json from https://modelscope.ai/datasets/yoyo-agent/yoyo; applying stays a human step.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-modelscope:
    needs: [meta, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
      MODELSCOPE_REPO: ${{ secrets.MODELSCOPE_REPO }}
      MODELSCOPE_ENDPOINT: ${{ secrets.MODELSCOPE_ENDPOINT }}
      YOYO_UPDATE_PRIVKEY: ${{ secrets.YOYO_UPDATE_PRIVKEY }}
      DEFAULT_MODELSCOPE_REPO: yoyo-agent/yoyo
      DEFAULT_MODELSCOPE_ENDPOINT: https://www.modelscope.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Require ModelScope secrets
        run: |
          set -euo pipefail
          if [[ -z "${MODELSCOPE_REPO:-}" || "${MODELSCOPE_REPO}" == "Shenchangxin/yoyo-releases" ]]; then
            MODELSCOPE_REPO="${DEFAULT_MODELSCOPE_REPO}"
            echo "MODELSCOPE_REPO=${MODELSCOPE_REPO}" >> "$GITHUB_ENV"
          fi
          if [[ -z "${MODELSCOPE_ENDPOINT:-}" ]]; then
            MODELSCOPE_ENDPOINT="${DEFAULT_MODELSCOPE_ENDPOINT}"
            echo "MODELSCOPE_ENDPOINT=${MODELSCOPE_ENDPOINT}" >> "$GITHUB_ENV"
          fi
          echo "MODELSCOPE_PREFER_AI_SITE=true" >> "$GITHUB_ENV"
          echo "publishing OTA to ${MODELSCOPE_ENDPOINT}/datasets/${MODELSCOPE_REPO}"
          missing=0
          for s in MODELSCOPE_API_TOKEN YOYO_UPDATE_PRIVKEY; do
            if [[ -z "${!s:-}" ]]; then
              echo "missing GitHub secret ${s}" >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Create public dataset https://modelscope.ai/datasets/${MODELSCOPE_REPO:-$DEFAULT_MODELSCOPE_REPO}, then set MODELSCOPE_API_TOKEN (issued on modelscope.ai, not modelscope.cn) and YOYO_UPDATE_PRIVKEY (Ed25519 hex from go run ./scripts/ota -keygen)." >&2
            exit 1
          fi

      - name: Build signed channel JSON
        run: |
          set -euo pipefail
          go run ./scripts/ota \
            -dist dist \
            -version "${VERSION}" \
            -repo "${MODELSCOPE_REPO}" \
            -endpoint "${MODELSCOPE_ENDPOINT}" \
            -out ota \
            -notes "Yoyo ${VERSION}"

      - name: Upload artifacts then channel pointers
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade modelscope-hub
          export MODELSCOPE_ENDPOINT
          export MODELSCOPE_API_TOKEN
          export MODELSCOPE_API_KEY="${MODELSCOPE_API_TOKEN}"
          export MODELSCOPE_SDK_TOKEN="${MODELSCOPE_API_TOKEN}"
          export MODELSCOPE_PREFER_AI_SITE=true
          # --endpoint must precede the subcommand; .cn and .ai are separate catalogs.
          ms-hub --endpoint "${MODELSCOPE_ENDPOINT}" --token "${MODELSCOPE_API_TOKEN}" login
          ms-hub --endpoint "${MODELSCOPE_ENDPOINT}" --token "${MODELSCOPE_API_TOKEN}" create "${MODELSCOPE_REPO}" --repo-type dataset --visibility public || true
          ms-hub --endpoint "${MODELSCOPE_ENDPOINT}" --token "${MODELSCOPE_API_TOKEN}" upload "${MODELSCOPE_REPO}" "ota/releases/v${VERSION}" "releases/v${VERSION}" \
            --repo-type dataset \
            --commit-message "release v${VERSION} artifacts" \
            --disable-tqdm
          ms-hub --endpoint "${MODELSCOPE_ENDPOINT}" --token "${MODELSCOPE_API_TOKEN}" upload "${MODELSCOPE_REPO}" ota/channels channels \
            --repo-type dataset \
            --commit-message "release v${VERSION} channels" \
            --disable-tqdm

      - name: Verify anonymous feed
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.request

          version = os.environ["VERSION"]
          repo = os.environ["MODELSCOPE_REPO"]
          endpoint = os.environ.get("MODELSCOPE_ENDPOINT", "https://www.modelscope.ai").rstrip("/")
          channels = sorted(pathlib.Path("ota/channels").glob("*.json"))
          if not channels:
              raise SystemExit("no channel json")
          ch = channels[0].name
          url = f"{endpoint}/datasets/{repo}/resolve/master/channels/{ch}"
          headers = {
              "User-Agent": "Yoyo-Updater",
              "Referer": endpoint + "/",
              "Cache-Control": "no-cache",
          }

          def fetch(target):
              last = None
              for attempt in range(8):
                  req = urllib.request.Request(target, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return resp.read()
                  except urllib.error.HTTPError as e:
                      last = e
                      time.sleep(3)
              raise SystemExit(f"verify fetch failed {target}: {last}")

          remote = json.loads(fetch(url).decode())
          sig = fetch(url + ".sig").strip()
          if len(sig) != 64:
              raise SystemExit(f"sig length {len(sig)}")
          expect = json.loads(channels[0].read_text())
          if remote.get("version") != version:
              raise SystemExit(f"remote version {remote.get('version')!r} != {version!r}")
          sums = {}
          for line in pathlib.Path("dist/SHA256SUMS.txt").read_text().splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  sums[parts[-1]] = parts[0].lower()
          for key in ("windows-amd64", "darwin-universal", "linux-amd64"):
              asset = remote["platforms"][key]
              want = sums[asset["filename"]]
              if asset["sha256"].lower() != want:
                  raise SystemExit(f"{key} sha mismatch")
              if asset["url"] != expect["platforms"][key]["url"]:
                  raise SystemExit(f"{key} url mismatch")
              if not asset["url"].startswith(endpoint + "/datasets/"):
                  raise SystemExit(f"{key} url not on {endpoint}: {asset['url']}")
          print("ok", url, remote["version"])
          PY
