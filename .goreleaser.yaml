version: 2

# CLI archives only. Desktop (Wails) binaries are built natively per OS by
# .github/workflows/release.yml on v* tags. Keep GitHub publishing disabled
# here so the two pipelines cannot fight over the same tag.
project_name: yoyo

builds:
  - id: cli
    main: ./cmd/yoyo
    binary: yoyo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Shenchangxin/yoyo/internal/version.Version={{.Version}}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  disable: true
