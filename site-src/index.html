    <meta name="theme-color" content="#f7f4ee" />
    <script>
      (function () {
        try {
          var qs = new URLSearchParams(location.search);
          var s = qs.get("lang") || localStorage.getItem("yoyo-site-lang");
          var n = (navigator.language || "en").toLowerCase();
          var l = s || (n.indexOf("zh") === 0 ? "zh" : n.indexOf("ja") === 0 ? "ja" : "en");
          if (l !== "en" && l !== "zh" && l !== "ja") l = "en";
          document.documentElement.dataset.lang = l;
          document.documentElement.lang = l === "zh" ? "zh-Hans" : l;
          var tq = qs.get("theme");
          var saved = localStorage.getItem("yoyo-site-theme");
          var dark =
            tq === "dark" || tq === "light"
              ? tq === "dark"
              : saved
                ? saved === "dark"
                : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#121211" : "#f7f4ee");
        } catch (e) {}
      })();
    </script>
